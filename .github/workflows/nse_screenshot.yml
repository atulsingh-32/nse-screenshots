
name: NSE Option Chain Screenshotter
"on":
 
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Check IST market hours
        id: hours
        run: |
          IST=$(TZ='Asia/Kolkata' date +%H%M)
          echo "Current IST time: $IST"
          if [ "$IST" -lt "930" ] || [ "$IST" -ge "1530" ]; then
            echo "in_window=false" >> $GITHUB_OUTPUT
          else
            echo "in_window=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install playwright tzdata

      - name: Install Playwright browsers
        run: playwright install firefox --with-deps

      - name: Take screenshot
        if: steps.hours.outputs.in_window == 'true'
        run: |
          python my.py \
            https://www.nseindia.com/option-chain \
            --manual \
            --count 1 \
            --output screenshots

      - name: Commit screenshot
        if: steps.hours.outputs.in_window == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p screenshots
          git add -A
          git diff --cached --quiet || git commit -m "📸 $(date +'%d-%m-%Y %H:%M') IST"
          git push || true
