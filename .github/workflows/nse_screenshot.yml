
name: NSE Option Chain Screenshotter

on:
  schedule:
    # 9:00 AM IST = 3:30 UTC
    #  3.:30 PM IST (midnight) = 6:30 PM UTC
    # Every 5 minutes from 3:30 UTC to 18:30 UTC = 9:00 AM to 3:30 PM IST
     - cron: '30,35,40,45,50,55 3 * * 1-5'           # 3:30–3:55 UTC = 9:00–9:25 AM IST
     - cron: '0,5,10,15,20,25,30,35,40,45,50,55 4-9 * * 1-5'  # 4:00–9:55 UTC = 9:30 AM–3:25 PM IST
     - cron: '0 10 * * 1-5'   # 18:00–18:30 UTC = 11:30 PM–12:00 AM IST

  # Run manually anytime from Actions tab
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install playwright tzdata

      - name: Install Playwright browsers
        run: playwright install firefox --with-deps

      - name: Take screenshot
        run: |
          python my.py \
            https://www.nseindia.com/option-chain \
            --manual \
            --count 1 \
            --output screenshots

      - name: Commit screenshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p screenshots
          git add -A
          git diff --cached --quiet || git commit -m "📸 $(date +'%d-%m-%Y %H:%M') IST"
          git push || true
